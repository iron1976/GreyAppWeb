
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;

            padding: 40px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

        h1 {

        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>What is Grey Ragdoll?</h1>

        <p>Grey Ragdoll is an upcoming Physics Driven Behavioural Ragdoll Physics system for Game Engines and Simulations</p>

</html>
